name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Cargo check
      run: cargo check --verbose
    - name: Cargo test
      run: cargo test --verbose
    - name: Clippy lint
      run: cargo clippy -- -D warnings
    - name: Verify atomic commits
      run: |
        curl -s https://raw.githubusercontent.com/gok/verify-atomic/main/verify_atomic.sh | bash
